<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="100%" height="100%">
  <!-- Left Side: POSITIVO (Light) -->
  <rect x="0" y="0" width="700" height="700" fill="#FFFFFF"/>
  <text x="60" y="70" font-family="monospace" font-size="13" font-weight="700" letter-spacing="3" fill="#9B1B22">01 / POSITIVO</text>
  <text x="60" y="92" font-family="'Satoshi', system-ui, sans-serif" font-size="13" fill="#736467">Stampa su carta bianca, fondi chiari istituzionali</text>

  <g transform="translate(350, 260)">
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#141416" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M -110 0 A 110 110 0 0 1 110 0" fill="none" stroke="#141416" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="0" y1="-110" x2="0" y2="0" stroke="#141416" stroke-width="5.5"/>
    <path d="M 0 -110 Q -50 -50 -68 0" fill="none" stroke="#141416" stroke-width="5.5"/>
    <path d="M 0 -110 Q 50 -50 68 0" fill="none" stroke="#141416" stroke-width="5.5"/>
    <path d="M -22 -110 A 22 14 0 0 1 22 -110" fill="none" stroke="#141416" stroke-width="5.5"/>
    <line x1="0" y1="-124" x2="0" y2="-144" stroke="#141416" stroke-width="4.5"/>
    <path d="M -8 -136 L 0 -150 L 8 -136" fill="none" stroke="#141416" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-74" cy="18" r="6.5" fill="#141416"/>
    <circle cx="-25" cy="18" r="6.5" fill="#141416"/>
    <circle cx="25" cy="18" r="6.5" fill="#141416"/>
    <circle cx="74" cy="18" r="6.5" fill="#141416"/>

    <text x="0" y="80" text-anchor="middle" font-family="'Montserrat', system-ui, sans-serif" font-weight="500" font-size="34" letter-spacing="-0.5" fill="#141416">Teatro</text>
    <text x="0" y="140" text-anchor="middle" font-family="'Montserrat', system-ui, sans-serif" font-weight="800" font-size="56" letter-spacing="-1.5" fill="#141416">Petruzzelli</text>
  </g>

  <line x1="700" y1="0" x2="700" y2="700" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>

  <!-- Right Side: NEGATIVO (Dark) -->
  <rect x="700" y="0" width="700" height="700" fill="#141416"/>
  <text x="760" y="70" font-family="monospace" font-size="13" font-weight="700" letter-spacing="3" fill="#E5B01E">02 / NEGATIVO</text>
  <text x="760" y="92" font-family="'Satoshi', system-ui, sans-serif" font-size="13" fill="#C5BFDF">Fondi scuri, nero palcoscenico, schermi digitali</text>

  <g transform="translate(1050, 260)">
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M -110 0 A 110 110 0 0 1 110 0" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="0" y1="-110" x2="0" y2="0" stroke="#FFFFFF" stroke-width="5.5"/>
    <path d="M 0 -110 Q -50 -50 -68 0" fill="none" stroke="#FFFFFF" stroke-width="5.5"/>
    <path d="M 0 -110 Q 50 -50 68 0" fill="none" stroke="#FFFFFF" stroke-width="5.5"/>
    <path d="M -22 -110 A 22 14 0 0 1 22 -110" fill="none" stroke="#FFFFFF" stroke-width="5.5"/>
    <line x1="0" y1="-124" x2="0" y2="-144" stroke="#FFFFFF" stroke-width="4.5"/>
    <path d="M -8 -136 L 0 -150 L 8 -136" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-74" cy="18" r="6.5" fill="#FFFFFF"/>
    <circle cx="-25" cy="18" r="6.5" fill="#FFFFFF"/>
    <circle cx="25" cy="18" r="6.5" fill="#FFFFFF"/>
    <circle cx="74" cy="18" r="6.5" fill="#FFFFFF"/>

    <text x="0" y="80" text-anchor="middle" font-family="'Montserrat', system-ui, sans-serif" font-weight="500" font-size="34" letter-spacing="-0.5" fill="#FFFFFF">Teatro</text>
    <text x="0" y="140" text-anchor="middle" font-family="'Montserrat', system-ui, sans-serif" font-weight="800" font-size="56" letter-spacing="-1.5" fill="#FFFFFF">Petruzzelli</text>
  </g>
