<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <g transform="translate(200, 150)">
    <!-- Base line & arch -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="currentColor" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M -100 0 A 100 100 0 0 1 100 0" fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Dome ribs & lantern -->
    <line x1="0" y1="-100" x2="0" y2="0" stroke="currentColor" stroke-width="5.5"/>
    <path d="M 0 -100 Q -45 -45 -62 0" fill="none" stroke="currentColor" stroke-width="5.5"/>
    <path d="M 0 -100 Q 45 -45 62 0" fill="none" stroke="currentColor" stroke-width="5.5"/>
    <path d="M -20 -100 A 20 12 0 0 1 20 -100" fill="none" stroke="currentColor" stroke-width="5.5"/>
    <line x1="0" y1="-112" x2="0" y2="-130" stroke="currentColor" stroke-width="4.5"/>
    <path d="M -7 -122 L 0 -136 L 7 -122" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 4 foundation rhythmic dots -->
    <circle cx="-68" cy="18" r="6" fill="currentColor"/>
    <circle cx="-23" cy="18" r="6" fill="currentColor"/>
    <circle cx="23" cy="18" r="6" fill="currentColor"/>
    <circle cx="68" cy="18" r="6" fill="currentColor"/>

    <!-- Typographic lockup -->
    <text x="0" y="80" text-anchor="middle" font-family="'Montserrat', system-ui, sans-serif" font-weight="800" font-size="52" letter-spacing="-1.2" fill="currentColor">Petruzzelli</text>
  </g>
</svg>
